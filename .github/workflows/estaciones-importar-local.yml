# Una sola vez (15/11): pasa a R2 lo que la notebook bajó antes de que la ronda corriera en la nube.
name: estaciones-importar-local
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            estaciones-privadas
            sipan-alto-valle/lib
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RADAR_TOKEN: ${{ secrets.RADAR_TOKEN }}
        run: node estaciones-privadas/importar-local.mjs
